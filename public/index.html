<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Crawler</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🕷️ Web Crawler</h1>
      <p class="subtitle">Crawl websites with robots.txt compliance, depth control, and export options</p>
    </header>

    <section class="card" id="new-crawl">
      <h2>Start New Crawl</h2>
      <form id="crawl-form">
        <div class="form-group">
          <label for="url">Starting URL</label>
          <input type="url" id="url" name="url" placeholder="https://example.com" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="depth">Max Depth (0-10)</label>
            <input type="number" id="depth" name="depth" min="0" max="10" value="2" required>
          </div>
          <div class="form-group">
            <label for="crawlId">Crawl ID (optional)</label>
            <input type="text" id="crawlId" name="crawlId" placeholder="auto-generated">
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="start-btn">Start Crawl</button>
      </form>
    </section>

    <section class="card" id="active-crawls" style="display: none;">
      <h2>Active Crawls</h2>
      <div id="active-list"></div>
    </section>

    <section class="card" id="completed-crawls">
      <h2>Completed Crawls</h2>
      <div id="crawl-list"></div>
    </section>

    <section class="card" id="crawl-detail" style="display: none;">
      <div class="detail-header">
        <h2 id="detail-title">Crawl Details</h2>
        <div class="detail-actions">
          <button class="btn btn-secondary" id="back-btn">← Back</button>
          <button class="btn btn-primary" id="export-json">Export JSON</button>
          <button class="btn btn-primary" id="export-csv">Export CSV</button>
          <button class="btn btn-primary" id="export-sitemap">Export Sitemap</button>
          <button class="btn btn-danger" id="delete-btn">Delete</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="table-container">
        <table id="urls-table">
          <thead>
            <tr>
              <th>URL</th>
              <th>Depth</th>
              <th>Status</th>
              <th>Links Found</th>
              <th>Timestamp</th>
              <th>Error</th>
            </tr>
          </thead>
          <tbody id="urls-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
